[package]
name = "swasthya-core"
version = "0.1.0"
description = "Encrypted local health record store for Arogya Swasthya: FHIR resources, people, trash, undo, backups, export"
license = "MIT"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.23"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
flate2 = "1"
getrandom = "0.3"
jiff = { version = "0.2", features = ["serde"] }
roxmltree = "0.21.2"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
