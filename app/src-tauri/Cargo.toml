[package]
name = "arogya-swasthya"
version = "0.1.0"
description = "Personal lifelong health manager: your records, kept on your devices"
license = "MIT"
edition = "2024"
publish = false

[lib]
name = "swasthya_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
swasthya-core = { version = "0.1.0", path = "../../core" }
tauri-plugin-swasthya-device = { version = "0.1.0", path = "../../plugins/device" }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2.5.0"
tauri-plugin-fs = "2"
