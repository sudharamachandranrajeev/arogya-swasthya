[package]
name = "arogya-swasthya"
version = "0.1.0"
description = "Personal lifelong health manager: your records, kept on your devices"
license = "MIT"
edition = "2024"
publish = false

[lib]
name = "swasthya_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
swasthya-core = { version = "0.1.0", path = "../../core" }
tauri-plugin-swasthya-device = { version = "0.1.0", path = "../../plugins/device" }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
sha2 = "0.10"
# The doctor report PDF.
typst-as-lib = "0.17.0"
typst-pdf = "0.15.1"
typst = "0.15.1"
typst-layout = "0.15.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Medicine reminders: start at login, only while reminders are on.
tauri-plugin-autostart = "2.7.0"
# Transcripts of recordings (desktop only for now).
whisper-rs = "0.16"
symphonia = { version = "0.6", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2.5.0"
tauri-plugin-fs = "2"
# The date type phone reminders are scheduled with.
time = "0.3"

[dev-dependencies]
tempfile = "3"
